name: Build & Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  # The Python runtime source repository. PyInstaller cannot cross-compile, so
  # each platform build checks out this repo and builds dsh-py natively.
  PYTHON_REPO: https://github.com/YSH-Forts/deepseek_harness.git
  PYTHON_REF: main

jobs:
  build-runtime:
    name: Build runtime (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: macos-14
            binary: dsh-py
          - target: darwin-x64
            os: macos-13
            binary: dsh-py
          - target: win32-x64
            os: windows-latest
            binary: dsh-py.exe
          - target: linux-x64
            # Pin the ABI baseline instead of inheriting a newer glibc whenever
            # GitHub advances ubuntu-latest.
            os: ubuntu-22.04
            binary: dsh-py
    steps:
      - name: Checkout extension source
        uses: actions/checkout@v4

      - name: Checkout runtime source
        uses: actions/checkout@v4
        with:
          repository: YSH-Forts/deepseek_harness
          ref: ${{ env.PYTHON_REF }}
          path: python-src

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        run: |
          cd python-src/deepseek-harness-python
          python -m pip install --upgrade pip
          pip install '.[dev]' pyinstaller

      - name: Build portable dsh-py runtime bundle
        shell: bash
        run: |
          cd python-src/deepseek-harness-python
          # PyInstaller cannot cross-compile. Build on the matching runner and
          # preserve the complete onedir layout expected by the extension:
          # bin/dsh-py/<binary> plus bin/dsh-py/runtime/.
          pyinstaller \
            --clean --noconfirm --onedir \
            --name dsh-py \
            --contents-directory runtime \
            --paths src \
            --collect-data deepseek_harness_py \
            --collect-data certifi \
            --exclude-module tkinter \
            --exclude-module test \
            --exclude-module unittest \
            --exclude-module pytest \
            src/deepseek_harness_py/__main__.py
          test -f "dist/dsh-py/${{ matrix.binary }}"
          test -f "dist/dsh-py/runtime/certifi/cacert.pem"
          ls -la "dist/dsh-py"

      - name: Smoke test packaged runtime
        shell: bash
        run: python scripts/smoke_runtime.py "python-src/deepseek-harness-python/dist/dsh-py/${{ matrix.binary }}"

      - name: Upload runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.target }}
          path: python-src/deepseek-harness-python/dist
          if-no-files-found: error

  package:
    name: Package VSIX
    needs: build-runtime
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            binary: dsh-py
          - target: darwin-x64
            binary: dsh-py
          - target: win32-x64
            binary: dsh-py.exe
          - target: linux-x64
            binary: dsh-py
    steps:
      - name: Checkout extension source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare target runtime directory
        shell: bash
        run: rm -rf bin runtime-artifact && mkdir -p bin

      - name: Download target runtime bundle
        uses: actions/download-artifact@v4
        with:
          name: runtime-${{ matrix.target }}
          path: runtime-artifact

      - name: Install target runtime bundle
        shell: bash
        run: |
          test -f "runtime-artifact/dsh-py/${{ matrix.binary }}"
          cp -R runtime-artifact/dsh-py bin/
          if [ "${{ matrix.target }}" != "win32-x64" ]; then chmod +x "bin/dsh-py/${{ matrix.binary }}"; fi
          test -f "bin/dsh-py/runtime/certifi/cacert.pem"

      - name: Install npm dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Read extension version
        id: extension-version
        shell: bash
        run: echo "value=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Package VSIX
        run: npx vsce package --target ${{ matrix.target }} --out deepseek-harness-vscode-${{ matrix.target }}-${{ steps.extension-version.outputs.value }}.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: '*.vsix'
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all VSIX artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List artifacts
        run: ls -la release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*.vsix
          generate_release_notes: true
