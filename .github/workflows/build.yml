name: Build & Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  # The Python runtime source repository. PyInstaller cannot cross-compile, so
  # each platform build checks out this repo and builds dsh-py natively.
  PYTHON_REPO: https://github.com/deepseek-ai/deepseek-harness.git
  PYTHON_REF: master

jobs:
  build-runtime:
    name: Build runtime (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: macos-14
            binary: dsh-py
          - target: win32-x64
            os: windows-2025
            binary: dsh.exe
          - target: linux-x64
            # Pin the ABI baseline instead of inheriting a newer glibc whenever
            # GitHub advances ubuntu-latest.
            os: ubuntu-22.04
            binary: dsh
    steps:
      - name: Checkout extension source
        uses: actions/checkout@v4

      - name: Checkout runtime source
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ env.PYTHON_REF }}
          path: python-src

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: python-src/pnpm-lock.yaml

      - name: Install Harness dependencies
        shell: bash
        working-directory: python-src
        run: |
          pnpm install --frozen-lockfile

      - name: Build native Harness runtime
        shell: bash
        working-directory: python-src
        env:
          DSH_BUILD_CLIENT_PROFILE: official
        run: |
          case "${{ matrix.target }}" in
            darwin-arm64) target=node24-macos-arm64; runtime=deepseek-harness-sdk-runtime-macos-arm64 ;;
            linux-x64) target=node24-linux-x64; runtime=deepseek-harness-sdk-runtime-linux-x64 ;;
            win32-x64) target=node24-win-x64; runtime=deepseek-harness-sdk-runtime-win-x64.exe ;;
          esac
          pnpm exec tsx scripts/build-exe-for-python-sdk.ts --targets="$target"
          mkdir -p "$GITHUB_WORKSPACE/runtime-artifact/dsh"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "dist-exe/$runtime" "$GITHUB_WORKSPACE/runtime-artifact/dsh/dsh.exe"
            cp "dist-exe/${runtime%.exe}-rg.exe" "$GITHUB_WORKSPACE/runtime-artifact/dsh/dsh-rg.exe"
          else
            cp "dist-exe/$runtime" "$GITHUB_WORKSPACE/runtime-artifact/dsh/dsh"
            cp "dist-exe/$runtime-rg" "$GITHUB_WORKSPACE/runtime-artifact/dsh/dsh-rg"
            if [ "${{ matrix.target }}" = "darwin-arm64" ]; then cp "dist-exe/$runtime-spawn-helper" "$GITHUB_WORKSPACE/runtime-artifact/dsh/dsh-spawn-helper"; fi
            chmod +x "$GITHUB_WORKSPACE/runtime-artifact/dsh/"*
          fi

      - name: Smoke test packaged runtime
        shell: bash
        run: python scripts/smoke_runtime.py "runtime-artifact/dsh/${{ matrix.binary }}"

      - name: Upload runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.target }}
          path: runtime-artifact
          if-no-files-found: error

  package:
    name: Package VSIX
    needs: build-runtime
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
          - target: win32-x64
          - target: linux-x64
    steps:
      - name: Checkout extension source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download target runtime bundle
        uses: actions/download-artifact@v4
        with:
          name: runtime-${{ matrix.target }}
          path: bin

      - name: Install npm dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Read extension version
        id: extension-version
        shell: bash
        run: echo "value=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Package VSIX
        run: npx vsce package --target ${{ matrix.target }} --out deepseek-harness-vscode-${{ matrix.target }}-${{ steps.extension-version.outputs.value }}.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: '*.vsix'
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all VSIX artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List artifacts
        run: ls -la release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*.vsix
          generate_release_notes: true
